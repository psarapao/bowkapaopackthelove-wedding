<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Gallery Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-stone-200/60 p-6 md:p-8 text-center">
    
    <!-- Header -->
    <div class="mb-6">
      <p class="text-xs uppercase tracking-widest text-stone-500 font-medium mb-1">Wedding Memories</p>
      <h1 class="text-2xl md:text-3xl font-serif-title font-semibold text-stone-800">Share Your Photos</h1>
      <p class="text-xs text-stone-500 mt-2">ร่วมแบ่งปันโมเมนต์ประทับใจในงานแต่งของเรา</p>
    </div>

    <!-- Form -->
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-medium text-stone-600 mb-1">ชื่อของคุณ</label>
        <input type="text" id="uploaderName" placeholder="เช่น เกลือ / โฟ๊ค" 
               class="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
      </div>

      <div>
        <label class="block text-xs font-medium text-stone-600 mb-1">คำอวยพรสั้นๆ (ถ้ามี)</label>
        <input type="text" id="uploaderMessage" placeholder="ยินดีด้วยนะ!" 
               class="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
      </div>

      <!-- File Drop Area -->
      <div>
        <label class="block text-xs font-medium text-stone-600 mb-1">เลือกรูปภาพ</label>
        <div onclick="document.getElementById('fileInput').click()" 
             class="border-2 border-dashed border-stone-300 rounded-2xl p-6 text-center cursor-pointer hover:border-stone-500 transition-colors bg-stone-50/50">
          <svg class="w-8 h-8 mx-auto text-stone-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span class="text-xs text-stone-600 font-medium">กดเลือกรูปภาพจากเครื่อง</span>
          <p class="text-[11px] text-stone-400 mt-1">อัปโหลดได้หลายรูปพร้อมกัน</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFilesSelected()">
      </div>

      <!-- Preview List & Progress -->
      <div id="fileInfo" class="text-xs text-stone-600 hidden"></div>
      
      <div id="progressContainer" class="hidden">
        <div class="flex justify-between text-xs text-stone-500 mb-1">
          <span id="progressText">กำลังอัปโหลด...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-stone-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-stone-800 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Upload Button -->
      <button id="uploadBtn" onclick="startUpload()" 
              class="w-full py-3 bg-stone-900 text-white rounded-xl text-sm font-medium hover:bg-stone-800 transition-colors shadow-sm disabled:bg-stone-300">
        ส่งรูปภาพ
      </button>

      <div id="statusAlert" class="hidden text-xs p-3 rounded-xl text-center"></div>
	  
	  <!-- ส่วนปุ่มเปิดดูรูปใน Google Drive -->
      <div class="mt-6 pt-5 border-t border-stone-200">
        <p class="text-xs text-stone-500 mb-2">อยากดูรูปทั้งหมดที่เพื่อนๆ ส่งเข้ามา?</p>
        <a href="https://drive.google.com/drive/folders/1L51iehZh70eKZD27B7mcwO3Buzh21XwL?usp=drive_link" target="_blank" 
           class="flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-medium transition-colors border border-stone-200">
          <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          เปิดดูอัลบั้มภาพใน Google Drive
        </a>
      </div>
	  
    </div>

  </div>

  <script>
    // ** ใส่ Web App URL ที่ได้จากการ Deploy Apps Script ตรงนี้ **
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKAhXSraSpglxxiV4_5mkfQUQo362f_l_1Nj0XC3SgkxYuEBrllIf3moSydDLL_DWAZw/exec";
    let selectedFiles = [];

    function handleFilesSelected() {
      const input = document.getElementById('fileInput');
      selectedFiles = Array.from(input.files);
      const info = document.getElementById('fileInfo');
      if (selectedFiles.length > 0) {
        info.textContent = `เลือกแล้ว ${selectedFiles.length} รูป`;
        info.classList.remove('hidden');
      }
    }

    // ฟังก์ชันบีบอัดรูปภาพผ่าน Canvas (ลดขนาดรูปและแปลงเป็น Base64)
    function compressImageToBase64(file, maxWidth = 1920, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve(base64);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function startUpload() {
      if (selectedFiles.length === 0) {
        alert("กรุณาเลือกรูปภาพอย่างน้อย 1 รูปครับ");
        return;
      }

      const name = document.getElementById('uploaderName').value.trim() || "Guest";
      const message = document.getElementById('uploaderMessage').value.trim();
      const btn = document.getElementById('uploadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressText = document.getElementById('progressText');
      const alertBox = document.getElementById('statusAlert');

      btn.disabled = true;
      progressContainer.classList.remove('hidden');
      alertBox.classList.add('hidden');

      let successCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        progressText.textContent = `กำลังอัปโหลดรูปที่ ${i + 1} จาก ${selectedFiles.length}...`;

        try {
          const base64Data = await compressImageToBase64(file);
          const payload = {
            uploaderName: name,
            message: message,
            base64: base64Data,
            mimeType: "image/jpeg",
            extension: "jpg"
          };

          // ส่งแบบ text/plain เพื่อเลี่ยงปัญหา CORS Preflight ใน Apps Script
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.status === "success") successCount++;
        } catch (err) {
          console.error("Upload error:", err);
        }

        const pct = Math.round(((i + 1) / selectedFiles.length) * 100);
        progressBar.style.width = `${pct}%`;
        progressPercent.textContent = `${pct}%`;
      }

      btn.disabled = false;
      alertBox.classList.remove('hidden');

      if (successCount === selectedFiles.length) {
        alertBox.className = "text-xs p-3 rounded-xl text-center bg-emerald-50 text-emerald-700 border border-emerald-200";
        alertBox.textContent = `อัปโหลดสำเร็จครบทั้ง ${successCount} รูป ขอบคุณมากครับ! 🎉`;
        selectedFiles = [];
        document.getElementById('fileInput').value = '';
        document.getElementById('fileInfo').classList.add('hidden');
      } else {
        alertBox.className = "text-xs p-3 rounded-xl text-center bg-amber-50 text-amber-700 border border-amber-200";
        alertBox.textContent = `อัปโหลดสำเร็จ ${successCount} จาก ${selectedFiles.length} รูป`;
      }
    }
  </script>
</body>
</html>
